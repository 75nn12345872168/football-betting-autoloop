name: Master Autoloop - Big-5 Verified Engine

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC = Weekend Settlement
    - cron: '0 6 * * 2'   # Tuesday 06:00 UTC = Close & Archive Matchweek Window (post-Monday fixtures)
    - cron: '0 18 * * 5'  # Friday 18:00 UTC = Fetch Weekend
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send a delivery-test message to Telegram (no odds needed)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  autoloop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch real odds (The Odds API)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -n "$THE_ODDS_API_KEY" ]; then
            python fetch_odds.py
          else
            echo "THE_ODDS_API_KEY not set; skipping real odds fetch."
          fi

      - name: Telegram delivery test (manual trigger)
        if: ${{ inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python autoloop_master.py --telegram-test

      - name: Run autoloop_master.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python autoloop_master.py
          echo "=== Settlement Summary ==="
          cat ledger_settlement_summary.json || true
          echo "=== Report ==="
          cat telegram_last_report.txt

      - name: Commit & Push ledger, history, and public web JSONs
        run: |
          git config --global user.name "hermes-bot"
          git config --global user.email "hermes@bot.local"
          git add paper_trading_ledger_2026.csv ledger_settlement_summary.json la_liga_matches_2018_2026.csv live_matches_ligue1.csv data/historical_big5_odds.csv data/public/ data/archive/ telegram_last_report.txt autoloop_last_run.json || true
          git diff --staged --quiet || git commit -m "auto: update ledger, settlement & public web json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "No push needed or no remote"
